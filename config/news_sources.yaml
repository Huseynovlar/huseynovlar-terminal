# Redundant Multi-Source Free World News, Economic Calendar & Macro Sources (0 $/month)
# `verified: true` / `is_verified: true` marks trusted institutional / official sources
# displayed with a green checkmark badge in the Verified Sources Registry.

rss_feeds:
  # --- Central Banks (Official Primary Releases — tier_1) ---
  - id: fed_press
    name: Federal Reserve Press Releases
    domain: federalreserve.gov
    url: https://www.federalreserve.gov/feeds/press_all.xml
    category: central_banks
    priority: critical
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [XAUUSD, USTEC, SPX, EURUSD]
    asset_tags: [XAUUSD, USTEC, SPX, EURUSD]
    poll_interval_sec: 120

  - id: ecb_press
    name: European Central Bank Press
    domain: ecb.europa.eu
    url: https://www.ecb.europa.eu/rss/press.html
    category: central_banks
    priority: high
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [EURUSD, XAUUSD]
    asset_tags: [EURUSD, XAUUSD]
    poll_interval_sec: 300

  - id: boe_press
    name: Bank of England News
    domain: bankofengland.co.uk
    url: https://www.bankofengland.co.uk/rss/news
    category: central_banks
    priority: high
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [GBPUSD, EURUSD, XAUUSD]
    asset_tags: [GBPUSD, EURUSD, XAUUSD]
    poll_interval_sec: 300

  # --- Gold & Commodities (XAUUSD primary + fallbacks) ---
  - id: kitco_gold
    name: Kitco Gold News
    domain: kitco.com
    url: https://www.kitco.com/rss/category/commodities/gold
    category: commodities
    priority: high
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [XAUUSD]
    asset_tags: [XAUUSD]
    poll_interval_sec: 120

  - id: investing_commodities
    name: Investing.com Commodities
    domain: investing.com
    url: https://www.investing.com/rss/news_11.rss
    category: commodities
    priority: medium
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_2
    default_assets: [XAUUSD, USOIL]
    asset_tags: [XAUUSD, USOIL]
    poll_interval_sec: 180

  # --- Forex & Global Macro (Multi-region) ---
  - id: fxstreet_news
    name: FXStreet Market News
    domain: fxstreet.com
    url: https://www.fxstreet.com/rss/news
    category: forex_macro
    priority: high
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [XAUUSD, USTEC, EURUSD, GBPUSD, USDJPY]
    asset_tags: [XAUUSD, USTEC, EURUSD, GBPUSD, USDJPY]
    poll_interval_sec: 90

  - id: investing_forex
    name: Investing.com Forex & Economy
    domain: investing.com
    url: https://www.investing.com/rss/news_1.rss
    category: forex_macro
    priority: medium
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_2
    default_assets: [XAUUSD, EURUSD, USDJPY]
    asset_tags: [XAUUSD, EURUSD, USDJPY]
    poll_interval_sec: 180

  # --- US Equities & Tech (USTEC / SPX primary + fallbacks) ---
  - id: cnbc_finance
    name: CNBC Finance & Markets
    domain: cnbc.com
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
    category: equities_macro
    priority: high
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [USTEC, SPX]
    asset_tags: [USTEC, SPX]
    poll_interval_sec: 120

  - id: cnbc_tech
    name: CNBC Technology
    domain: cnbc.com
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19854910
    category: tech
    priority: medium
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [USTEC, SPX]
    asset_tags: [USTEC, SPX]
    poll_interval_sec: 180

  - id: marketwatch_top
    name: MarketWatch (Dow Jones)
    domain: marketwatch.com
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    category: global_markets
    priority: high
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_1
    default_assets: [XAUUSD, USTEC, SPX]
    asset_tags: [XAUUSD, USTEC, SPX]
    poll_interval_sec: 120

  - id: yahoo_finance_top
    name: Yahoo Finance Global
    domain: finance.yahoo.com
    url: https://finance.yahoo.com/news/rssindex
    category: global_markets
    priority: medium
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_2
    default_assets: [USTEC, SPX, XAUUSD]
    asset_tags: [USTEC, SPX, XAUUSD]
    poll_interval_sec: 180

  # --- Digital Assets / Crypto ---
  - id: coindesk_crypto
    name: CoinDesk Markets
    domain: coindesk.com
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    category: crypto
    priority: medium
    verified: true
    is_verified: true
    is_enabled: true
    trust_tier: tier_2
    default_assets: [BTCUSD]
    asset_tags: [BTCUSD]
    poll_interval_sec: 180

  # --- Global Wire & Geopolitics (Aggregators — marked unverified unless corroborated) ---
  - id: google_news_markets
    name: Google News World Markets
    domain: news.google.com
    url: https://news.google.com/rss/search?q=gold+OR+nasdaq+OR+federal+reserve+OR+inflation&hl=en-US&gl=US&ceid=US:en
    category: global_wire
    priority: medium
    verified: false
    is_verified: false
    is_enabled: true
    trust_tier: tier_2
    default_assets: [XAUUSD, USTEC, SPX]
    asset_tags: [XAUUSD, USTEC, SPX]
    poll_interval_sec: 240

  - id: gdelt_geopolitics
    name: GDELT 2.0 Geopolitics & Macro
    domain: gdeltproject.org
    url: https://api.gdeltproject.org/api/v2/doc/doc
    type: gdelt_api
    query: "(gold OR federal reserve OR inflation OR geopolitical crisis OR nasdaq)"
    category: geopolitics
    priority: medium
    verified: false
    is_verified: false
    is_enabled: true
    trust_tier: tier_2
    default_assets: [XAUUSD, USTEC, SPX]
    asset_tags: [XAUUSD, USTEC, SPX]
    poll_interval_sec: 300

economic_calendar:
  primary_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  fallback_url: https://nfs.faireconomy.media/ff_calendar_nextweek.json
  poll_interval_sec: 900
  high_impact_currencies: [USD, EUR, GBP, JPY, CHF, CAD, AUD]

macro_quotes:
  poll_interval_sec: 60
  symbols:
    - code: DXY
      yahoo: DX-Y.NYB
      label: US Dollar Index
    - code: US10Y
      yahoo: "^TNX"
      label: US 10Y Yield
    - code: VIX
      yahoo: "^VIX"
      label: Volatility Index
    - code: SPX
      yahoo: "^GSPC"
      label: S&P 500
    - code: NDX
      yahoo: "^NDX"
      label: NASDAQ-100
    - code: XAUUSD
      yahoo: "GC=F"
      label: Gold Futures
    - code: XAGUSD
      yahoo: "SI=F"
      label: Silver Futures
    - code: BTCUSD
      yahoo: "BTC-USD"
      label: Bitcoin USD
