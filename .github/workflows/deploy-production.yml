name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huseynovlar-terminal-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 100.104.116.58
  DEPLOY_USER: deploy-bot
  NETBIRD_MANAGEMENT_URL: https://vpn.huseynovlar.org

jobs:
  deploy:
    name: Test, build and deploy over NetBird
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend lint & tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check app tests
          pytest -q

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker images
        run: |
          TAG="${GITHUB_SHA:0:12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f backend/Dockerfile -t "huseynovlar-terminal-backend:$TAG" .
          docker build -f frontend/Dockerfile -t "huseynovlar-terminal-frontend:$TAG" .

      - name: Create release bundle
        run: |
          mkdir -p bundle
          docker save "huseynovlar-terminal-backend:$TAG" -o bundle/backend.tar
          docker save "huseynovlar-terminal-frontend:$TAG" -o bundle/frontend.tar
          tar -czf release.tgz -C bundle .

      - name: Install NetBird
        run: |
          sudo install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/netbird.gpg
          echo "deb [signed-by=/etc/apt/keyrings/netbird.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq netbird

      - name: Join private deployment network
        env:
          NETBIRD_SETUP_KEY: "${{ secrets.NETBIRD_SETUP_KEY }}"
        run: |
          test -n "$NETBIRD_SETUP_KEY"
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --management-url "$NETBIRD_MANAGEMENT_URL"
          sudo netbird status --check startup

      - name: Wait for deployment server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Waiting for $DEPLOY_HOST:22 via NetBird ($attempt/30)..."
            if timeout 3 bash -c "</dev/tcp/$DEPLOY_HOST/22" 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo "SSH never became reachable over NetBird." >&2
          sudo netbird status --detail || true
          exit 1

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}"
          DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}"
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over NetBird SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$TAG" < release.tgz

      - name: Leave NetBird
        if: always()
        run: sudo netbird down || true
