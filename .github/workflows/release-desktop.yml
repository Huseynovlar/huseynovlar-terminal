name: Release Desktop (Tauri v2)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish desktop app on self-hosted runner
    runs-on: self-hosted
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebKitGTK / AppImage dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Desktop Dependencies
        working-directory: apps/desktop
        run: npm install

      # Verify the Tauri updater key/password pair before the native build.
      - name: Validate updater signing key
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add it to the production Environment secrets."
            exit 1
          fi
          printf 'Huseynovlar Terminal updater signing preflight\n' > "$RUNNER_TEMP/tauri-signing-preflight.txt"
          npx tauri signer sign "$RUNNER_TEMP/tauri-signing-preflight.txt"
          test -s "$RUNNER_TEMP/tauri-signing-preflight.txt.sig"
          rm -f "$RUNNER_TEMP/tauri-signing-preflight.txt" "$RUNNER_TEMP/tauri-signing-preflight.txt.sig"
        shell: bash

      - name: Build & Sign Tauri v2 Installers
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Huseynovlar Terminal v__VERSION__"
          releaseBody: "Huseynovlar Terminal desktop release built on the configured self-hosted runner. This release contains artifacts for that runner's native platform. Tauri updater artifacts are signed."
          releaseDraft: false
          prerelease: false

      - name: Verify ad-hoc macOS code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/desktop/target -type d -path '*/bundle/macos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::The macOS .app bundle was not found after building."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1

      - name: Keep only the current complete release
        uses: actions/github-script@v7
        with:
          script: |
            const version = require("./apps/desktop/tauri.conf.json").version;
            const tag = `v${version}`;
            const { owner, repo } = context.repo;

            const { data: current } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag
            });

            if (current.draft) {
              core.setFailed(`The current release ${tag} is still a draft.`);
              return;
            }

            if (!current.assets || current.assets.length < 1) {
              core.setFailed(`The current release ${tag} has no build artifacts.`);
              return;
            }

            const versionParts = (value) => {
              const match = value.match(/^v?(\d+)\.(\d+)\.(\d+)$/);
              return match ? match.slice(1).map(Number) : null;
            };
            const compareVersions = (left, right) => {
              const a = versionParts(left);
              const b = versionParts(right);
              if (!a || !b) return 0;
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            };

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            const newestTag = releases
              .map((release) => release.tag_name)
              .filter((releaseTag) => versionParts(releaseTag))
              .reduce((newest, releaseTag) =>
                compareVersions(releaseTag, newest) > 0 ? releaseTag : newest,
                tag
              );

            if (compareVersions(newestTag, tag) > 0) {
              core.notice(`Skipping cleanup for ${tag}; newer release ${newestTag} already exists.`);
              return;
            }

            for (const release of releases) {
              if (release.id === current.id) continue;

              core.info(`Removing obsolete release ${release.id} (${release.tag_name})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const remaining = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            if (remaining.length !== 1 || remaining[0].id !== current.id) {
              core.setFailed(`Expected only release ${tag} to remain; found ${remaining.length} releases.`);
              return;
            }

            core.info(`Cleanup complete. Only ${tag} remains.`);
