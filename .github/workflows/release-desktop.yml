name: Release Desktop (macOS M1)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish macOS Apple Silicon (M1)
    runs-on: macos-14
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This workflow must run on an Apple Silicon Mac (arm64)."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Desktop Dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Validate updater signing key
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add it to the production Environment secrets."
            exit 1
          fi
          printf 'Huseynovlar Terminal updater signing preflight\n' > "$RUNNER_TEMP/tauri-signing-preflight.txt"
          npx tauri signer sign "$RUNNER_TEMP/tauri-signing-preflight.txt"
          test -s "$RUNNER_TEMP/tauri-signing-preflight.txt.sig"
          rm -f "$RUNNER_TEMP/tauri-signing-preflight.txt" "$RUNNER_TEMP/tauri-signing-preflight.txt.sig"
        shell: bash

      - name: Build & Sign macOS M1 Installer
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Huseynovlar Terminal v__VERSION__ (macOS M1)"
          releaseBody: "Huseynovlar Terminal desktop release for macOS Apple Silicon (M1 / ARM64) only. Tauri updater artifacts are signed."
          releaseDraft: false
          prerelease: false
          args: "--target aarch64-apple-darwin"

      - name: Verify macOS application signature
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/desktop/target -type d -path '*/bundle/macos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::The macOS .app bundle was not found after building."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1

      - name: Keep only the current macOS M1 release
        uses: actions/github-script@v7
        with:
          script: |
            const version = require("./apps/desktop/tauri.conf.json").version;
            const tag = `v${version}`;
            const { owner, repo } = context.repo;

            const { data: current } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag
            });

            if (current.draft) {
              core.setFailed(`The current release ${tag} is still a draft.`);
              return;
            }

            const expectedAssets = new Set([
              `Huseynovlar.Terminal_${version}_aarch64.dmg`,
              `Huseynovlar.Terminal_${version}_aarch64.app.tar.gz`,
              `Huseynovlar.Terminal_${version}_aarch64.app.tar.gz.sig`,
              "latest.json"
            ]);
            const actualNames = new Set((current.assets || []).map(asset => asset.name));
            const missingAssets = [...expectedAssets].filter(name => !actualNames.has(name));
            if (missingAssets.length) {
              core.setFailed(`The macOS M1 release is incomplete. Missing: ${missingAssets.join(", ")}`);
              return;
            }

            for (const asset of current.assets || []) {
              if (expectedAssets.has(asset.name)) continue;
              core.info(`Removing non-M1/obsolete release asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id
              });
            }

            const { data: refreshed } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: current.id
            });
            const remainingNames = (refreshed.assets || []).map(asset => asset.name).sort();
            const expectedNames = [...expectedAssets].sort();
            if (JSON.stringify(remainingNames) !== JSON.stringify(expectedNames)) {
              core.setFailed(`Release assets are not limited to the expected macOS M1 files: ${remainingNames.join(", ")}`);
              return;
            }

            const versionParts = (value) => {
              const match = value.match(/^v?(\d+)\.(\d+)\.(\d+)$/);
              return match ? match.slice(1).map(Number) : null;
            };
            const compareVersions = (left, right) => {
              const a = versionParts(left);
              const b = versionParts(right);
              if (!a || !b) return 0;
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            };

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            const newestTag = releases
              .map(release => release.tag_name)
              .filter(releaseTag => versionParts(releaseTag))
              .reduce((newest, releaseTag) =>
                compareVersions(releaseTag, newest) > 0 ? releaseTag : newest,
                tag
              );

            if (compareVersions(newestTag, tag) > 0) {
              core.notice(`Skipping old-release cleanup for ${tag}; newer release ${newestTag} already exists.`);
              return;
            }

            for (const release of releases) {
              if (release.id === current.id) continue;
              core.info(`Removing obsolete release ${release.id} (${release.tag_name})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.info(`Release ${tag} is published with macOS M1 assets only.`);
