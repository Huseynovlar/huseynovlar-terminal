name: Release Desktop (Tauri v2)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    # A main-branch commit with this marker starts a deliberate release.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[release-desktop]')
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux WebKitGTK / AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Desktop Dependencies
        working-directory: apps/desktop
        run: npm install

      # Verify the Tauri updater key/password pair before any native build.
      - name: Validate updater signing key
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add it to the production Environment secrets."
            exit 1
          fi
          printf 'Huseynovlar Terminal updater signing preflight\n' > "$RUNNER_TEMP/tauri-signing-preflight.txt"
          npx tauri signer sign "$RUNNER_TEMP/tauri-signing-preflight.txt"
          test -s "$RUNNER_TEMP/tauri-signing-preflight.txt.sig"
          rm -f "$RUNNER_TEMP/tauri-signing-preflight.txt" "$RUNNER_TEMP/tauri-signing-preflight.txt.sig"
        shell: bash

      - name: Build & Sign Tauri v2 Installers
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Huseynovlar Terminal v__VERSION__"
          releaseBody: "Huseynovlar Terminal desktop release. macOS builds use an ad-hoc code signature for personal use; macOS may require manual approval in Privacy & Security. Tauri updater artifacts are signed."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify ad-hoc macOS code signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/desktop/target -type d -path '*/bundle/macos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::The macOS .app bundle was not found after building."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1

  publish-release:
    name: Keep only the current complete release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish only after all platform builds pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./apps/desktop/tauri.conf.json').version")"
          REPO="$GITHUB_REPOSITORY"

          RELEASE_JSON="$(gh api "repos/$REPO/releases/tags/$TAG")"
          if [ "$(jq -r '.draft' <<< "$RELEASE_JSON")" != "false" ]; then
            echo "::error::The current release $TAG is not published."
            exit 1
          fi
          CURRENT_ID="$(jq -r '.id' <<< "$RELEASE_JSON")"
          ASSET_COUNT="$(jq '.assets | length' <<< "$RELEASE_JSON")"
          if [ "$ASSET_COUNT" -lt 10 ]; then
            echo "::error::Only $ASSET_COUNT assets are attached to $TAG; refusing to remove previous releases."
            exit 1
          fi
          echo "Verified $TAG (release $CURRENT_ID) with $ASSET_COUNT assets."

          OLD_RELEASES="$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | [.id, .tag_name] | @tsv')"
          while IFS=$'\t' read -r OLD_ID OLD_TAG; do
            [ -z "$OLD_ID" ] && continue
            if [ "$OLD_ID" = "$CURRENT_ID" ]; then
              continue
            fi
            echo "Removing duplicate/obsolete release $OLD_ID ($OLD_TAG)"
            gh api --silent --method DELETE "repos/$REPO/releases/$OLD_ID"
            if [ "$OLD_TAG" != "$TAG" ] && gh api --silent "repos/$REPO/git/ref/tags/$OLD_TAG" >/dev/null 2>&1; then
              gh api --silent --method DELETE "repos/$REPO/git/refs/tags/$OLD_TAG"
            fi
          done <<< "$OLD_RELEASES"

          REMAINING="$(gh api "repos/$REPO/releases?per_page=100" --jq 'length')"
          if [ "$REMAINING" -ne 1 ]; then
            echo "::error::Expected exactly one release after cleanup, found $REMAINING."
            exit 1
          fi
          echo "Cleanup complete. Only $TAG remains."

