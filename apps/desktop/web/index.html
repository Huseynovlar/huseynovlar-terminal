<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huseynovlar Terminal</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0B0E14;
        color: #E2E8F0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #11161F;
        border: 1px solid #263042;
        border-radius: 4px;
        padding: 24px;
      }
      .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .logo { width: 36px; height: 36px; border-radius: 4px; }
      .title { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #FFFFFF; }
      .sub { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, monospace; color: #94A3B8; margin-top: 2px; }
      .status-box {
        border: 1px solid rgba(59, 130, 246, 0.35);
        background: rgba(59, 130, 246, 0.1);
        border-radius: 4px;
        padding: 12px;
        font-size: 12px;
        line-height: 1.45;
        margin-bottom: 14px;
      }
      .status-box.warn {
        border-color: rgba(245, 158, 11, 0.45);
        background: rgba(245, 158, 11, 0.1);
        color: #F59E0B;
      }
      .status-box.ok {
        border-color: rgba(16, 185, 129, 0.45);
        background: rgba(16, 185, 129, 0.1);
        color: #10B981;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #0B0E14;
        border: 1px solid #1E2634;
        border-radius: 4px;
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        margin-bottom: 12px;
      }
      label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #94A3B8; margin-bottom: 5px; }
      input {
        width: 100%;
        height: 32px;
        background: #0B0E14;
        border: 1px solid #263042;
        border-radius: 4px;
        color: #E2E8F0;
        padding: 0 10px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11.5px;
        margin-bottom: 14px;
      }
      .actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .hint { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, monospace; color: #64748B; }
      button {
        height: 32px;
        padding: 0 14px;
        border-radius: 4px;
        border: none;
        background: #3B82F6;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #2563EB; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <img class="logo" src="./icon.png" alt="Huseynovlar Terminal" />
        <div>
          <div class="title">HUSEYNOVLAR TERMINAL</div>
          <div class="sub">TAURI V2 · VPN PRE-FLIGHT GATE</div>
        </div>
      </div>

      <div id="statusBox" class="status-box">
        Проверка защищённого соединения и VPN-туннеля...
      </div>

      <div class="row">
        <span style="color:#94A3B8">VPN-туннель ОС</span>
        <span id="tunnelLabel" style="color:#94A3B8">ПРОВЕРКА...</span>
      </div>

      <label for="serverUrl">Адрес закрытого сервера терминала (VPN)</label>
      <input id="serverUrl" type="url" placeholder="https://terminal.huseynovlar.org" />

      <div class="actions">
        <span class="hint">Автоповтор каждые 5 сек</span>
        <button id="retryBtn" type="button">Проверить снова</button>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "ht_desktop_server_url_v1";
      const DEFAULT_URL = "https://terminal.huseynovlar.org";
      const LEGACY_HOSTS = new Set(["terminal.huseynovlar.com", "api.huseynovlar.com"]);

      function normalizeServerUrl(value) {
        const candidate = (value || DEFAULT_URL).trim().replace(/[/]+$/, "");
        try {
          const parsed = new URL(candidate);
          if (LEGACY_HOSTS.has(parsed.hostname.toLowerCase())) return DEFAULT_URL;
          return candidate;
        } catch {
          return DEFAULT_URL;
        }
      }
      const input = document.getElementById("serverUrl");
      const statusBox = document.getElementById("statusBox");
      const tunnelLabel = document.getElementById("tunnelLabel");
      const retryBtn = document.getElementById("retryBtn");

      const savedUrl = normalizeServerUrl(localStorage.getItem(STORAGE_KEY));
      input.value = savedUrl;
      localStorage.setItem(STORAGE_KEY, savedUrl);

      function getBaseUrl() {
        const val = (input.value || DEFAULT_URL).trim().replace(/\/+$/, "");
        localStorage.setItem(STORAGE_KEY, val);
        return val;
      }

      let checking = false;

      async function checkVpn() {
        if (checking) return;
        checking = true;
        const base = getBaseUrl();
        const healthUrl = base + "/healthz";
        retryBtn.disabled = true;
        try {
          let res;
          if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === "function") {
            res = await window.__TAURI_INTERNALS__.invoke("check_vpn_status", { endpoint: healthUrl });
          } else {
            const r = await fetch(healthUrl);
            res = { connected: r.ok, tunnel_detected: r.ok, message: r.ok ? "VPN: OK" : "HTTP " + r.status };
          }
          tunnelLabel.textContent = res.tunnel_detected
            ? "● " + (res.interface_name || "ACTIVE")
            : "○ НЕ ОБНАРУЖЕН";
          tunnelLabel.style.color = res.tunnel_detected ? "#10B981" : "#F43F5E";

          if (res.connected) {
            statusBox.className = "status-box ok";
            statusBox.textContent = "VPN: OK — подключение к терминалу...";
            window.location.replace(base + "/dashboard/home");
            return;
          }
          statusBox.className = "status-box warn";
          statusBox.textContent = res.message || "Нет доступа к закрытому серверу — проверьте подключение к VPN";
        } catch (err) {
          statusBox.className = "status-box warn";
          statusBox.textContent = "Нет доступа к закрытому серверу — проверьте подключение к VPN";
        } finally {
          checking = false;
          retryBtn.disabled = false;
        }
      }

      retryBtn.addEventListener("click", checkVpn);
      checkVpn();
      setInterval(checkVpn, 5000);
    </script>
  </body>
</html>
